name: Bug Report
description: Report a bug in career-ops
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "e.g., macOS 15, Ubuntu 24.04, Windows 11"
  - type: markdown
    attributes:
      value: |
        ---
        Career Command Center is based on the original [career-ops](https://github.com/santifer/career-ops) project by [santifer](https://santifer.io) — upstream attribution is retained under the MIT License.

        For bugs in this repository, use this issue tracker: [yrusc9814-web/career-command-center issues](https://github.com/yrusc9814-web/career-command-center/issues).
