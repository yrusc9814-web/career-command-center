# 中国大陆门户扫描配置 — career-ops
#
# 适配方向：采购（执行采购 / 寻源与供应商开发 / 战略与品类采购）
# 目标公司：制造企业 + 贸易/品牌商 + 零售/消费企业 + 供应链服务公司（按候选人目标品类自填）
# Base 城市：用 {city} 占位（复制到 portals.yml 后替换成你的目标城市，如示例城市）
#
# 三层策略（见 modes/scan.md）：
#   1. Playwright → 企业自有招聘页（首选，制造/贸易/零售集团多数无登录）
#   2. WebSearch → Boss直聘/拉勾/猎聘 用于发现，详情常需人工
#   3. （Greenhouse API 在国内基本不适用，禁用）
#
# 修改方法：直接告诉 Claude "改 portals.yml" 或自己编辑这个文件

# ============================================================
# Title 过滤器
# ============================================================
# 至少 1 个 positive 命中 + 0 个 negative 命中（不区分大小写）

title_filter:
  positive:
    # -- 采购序列（核心）--
    - "采购"
    - "采购专员"
    - "高级采购"
    - "采购主管"
    - "采购经理"
    - "供应商开发"
    - "寻源"
    - "战略采购"
    - "品类采购"
    - "Sourcing"
    - "Supplier Development"
    - "Category Procurement"

  negative:
    # -- 不要的相邻职能（注意：不禁"供应链"整词 —— 供应链采购 / 供应链管理是正向同义词）--
    - "仓库"
    - "物流专员"
    - "销售"
    - "跟单员"
    - "计划员"
    - "PMC"
    - "SQE"

    # -- 不要的 seniority --
    - "实习"
    - "实习生"
    - "Intern"
    - "校招"
    - "应届"

  seniority_boost:
    # 命中加权（不强制）—— 采购序列职级词表
    # （Phase 1 冻结：只换词，数值机制不变；与用户实例 portals.yml 同款采购五词）
    - "采购主管"
    - "采购经理"
    - "采购总监"
    - "负责人"
    - "高级采购专员"

# ============================================================
# Search Queries（Level 3 — 广度发现）
# ============================================================
# 通过 WebSearch 在国内门户和搜索引擎上发现新岗位
# 注意：详情页常需登录，发现到的 URL 大概率要人工取 JD
#
# 可选字段（2026-04-20 新增）：
#   priority: high | low    — high 是核心 query 每次跑，low 仅在用户选"全跑"时跑
#   enabled:  true | false  — 关闭的不会加入候选集
#
# {city} 占位说明：复制到 portals.yml 后统一替换成目标城市（可写多个 "城市A OR 城市B"）。
#
# ⚠️ WebSearch query 写法约束（实测发现，2026-04-20）：
#   ❌ 失败：site:X/deep/path ...           如 site:v2ex.com/go/jobs
#   ❌ 失败：site:A OR site:B ...           多站点 OR
#   ✅ 可用：site:tld (A OR B)              顶域 + OR 关键词组
#   ✅ 可用：品牌名 子路径关键词 2026        纯自然语言
#   规则：新 query 出现深路径 site: → 改自然语言。看 modes/scan.md 配置段的约束表。

search_queries:
  # -- Boss直聘 --
  - name: Boss直聘 — 采购执行与寻源
    query: 'site:zhipin.com "采购专员" OR "采购主管" OR "供应商开发" OR "寻源" {city}'
    enabled: true

  - name: Boss直聘 — 品类采购
    query: 'site:zhipin.com "品类采购" OR "战略采购" OR "采购经理" 高级'
    enabled: true

  # -- 拉勾 --
  - name: 拉勾 — 采购与供应链采购
    query: 'site:lagou.com "采购" OR "sourcing" OR "供应商开发" 资深 OR 高级'
    enabled: true

  # -- 猎聘 --
  - name: 猎聘 — 采购经理/总监
    query: 'site:liepin.com "采购经理" OR "采购总监" OR "品类采购" OR "战略采购" 经理 OR 总监 OR 负责人'
    enabled: true

  # -- 智联招聘 --
  - name: 智联 — 采购
    query: 'site:zhaopin.com "采购专员" OR "采购主管" OR "供应商开发" 高级'
    enabled: false  # 默认关掉，噪音较大

  # -- 51Job --
  - name: 51job — 采购
    query: 'site:51job.com "采购" OR "寻源" OR "sourcing" 高级 OR 资深'
    enabled: false

  # -- V2EX 招聘版（采购岗少，作补充渠道）--
  - name: V2EX — 采购/供应链招聘
    query: 'site:v2ex.com/go/jobs "采购" OR "供应链" "招聘"'
    enabled: true

  # -- GitHub README 招聘（部分企业/团队在开源仓库维护 hiring 段，作补充渠道）--
  - name: GitHub — 企业招聘
    query: 'site:github.com "招聘" "采购" OR "sourcing" OR "procurement" filename:README.md'
    enabled: true

# ============================================================
# Tracked Companies（Level 1 — Playwright 直抓）
# ============================================================
# 每个公司必须有 careers_url
# 制造 / 贸易 / 零售企业的自有招聘页多数无需登录，可以直接 Playwright 抓
#
# 可选字段（2026-04-20 新增）：
#   category:     manufacturer | trader_brand | retail_consumer | supply_chain_service | mnc_china
#                 制造企业 / 贸易与品牌商 / 零售与消费 / 供应链服务 / 外企在华
#                 用于分组扫描（将来可能支持 --category=<name> 过滤）
#   ats:          workday | greenhouse | smartrecruiters | mokahr | feishu | custom
#                 用于针对性 selector 提示（Mokahr/飞书 通常需登录 → 走 bookmarklet 不扫）
#   scan_method:  playwright | websearch
#   scan_query:   当 scan_method=websearch 时的自定义 query
#
# 使用指引（重要）：
#   - 本文件是示例，tracked_companies 只给了 3 条匿名占位 —— **不要照抄成真实公司清单**
#   - 请按你的目标品类（如工程机械 / 汽车零部件 / 生鲜食品 / 电子元器件等）自填：
#     1. 在招聘平台搜你的目标品类 + 采购，找出常年在招的企业
#     2. 找到每家的自有招聘页 careers_url（集团官网"加入我们"页）
#     3. 逐条填入下面的格式，enabled: true
#   - 外企在华采购办通常用 Workday / Greenhouse 等公开 ATS，Playwright 可直抓
#   - 噪音大的 query / 公司用 enabled: false 关掉，别删（留作以后抽查）

tracked_companies:

  # =====================================================
  # 示例占位（复制后替换为你的真实目标公司）
  # =====================================================

  - name: 某工程机械整机厂（示例）
    careers_url: https://careers.example-oem.com/jobs
    category: manufacturer
    scan_method: playwright
    notes: "示例：工程机械整机厂，采购品类以机械零部件 / 原材料 / 外协件为主。替换成你的真实目标公司。"
    enabled: false

  - name: 某汽车零部件集团（示例）
    careers_url: https://jobs.example-autoparts.cn/positions
    category: manufacturer
    scan_method: playwright
    notes: "示例：汽车零部件集团，寻源 / 品类采购岗位量较大，多基地布局。替换成你的真实目标公司。"
    enabled: false

  - name: 某快消零售集团（示例）
    careers_url: https://careers.example-retail.com/social
    category: retail_consumer
    ats: mokahr
    scan_method: websearch
    scan_query: '"某快消零售集团" 招聘 采购 OR 寻源'
    notes: "示例：快消 / 零售集团，多数用 Mokahr / 飞书表单 → 详情走 bookmarklet，列表作发现用。替换成你的真实目标公司。"
    enabled: false
