# Portal Scanner Configuration
# Used by /career-ops scan to discover new offers automatically.
#
# Strategy (3 levels):
#   1. Playwright → careers_url of each company (real-time, reliable)
#   2. Greenhouse API → structured JSON (fast, Greenhouse-only)
#   3. WebSearch with site: filters (broad discovery, may be stale)
#
# IMPORTANT: Each company in tracked_companies MUST have careers_url.
#
# HOW TO CUSTOMIZE:
#   1. Copy this file to portals.yml in the project root
#   2. Edit title_filter.positive with YOUR target role keywords
#   3. Replace the anonymous placeholder companies in tracked_companies
#      with YOUR real target companies
#   4. Adjust search_queries for your preferred job boards
#   5. Set enabled: false on companies you don't care about

# -- Title filter --
# The scanner uses these keywords to decide if a title is relevant.
# At least 1 positive must match AND 0 negatives must match (case-insensitive).

title_filter:
  positive:
    # [CUSTOMIZE] Add keywords matching YOUR target roles
    # -- Procurement roles (core) --
    - "Buyer"
    - "Procurement Specialist"
    - "Senior Buyer"
    - "Procurement Supervisor"
    - "Procurement Manager"
    - "Sourcing Specialist"
    - "Strategic Sourcing"
    - "Category Buyer"
    - "Category Manager"
    - "Supplier Development"
  negative:
    # [CUSTOMIZE] Add keywords for roles you want to exclude
    # -- Adjacent functions to exclude (do NOT exclude "Supply Chain" as a whole --
    #    supply chain procurement / supply chain management stay positive-adjacent) --
    - "Warehouse"
    - "Logistics Coordinator"
    - "Sales"
    - "Merchandiser"
    - "Production Planner"
    - "PMC"
    - "SQE"
    # -- Seniority --
    - "Junior"
    - "Intern"
  seniority_boost:
    # These prefixes add relevance but are not required.
    # Procurement seniority ladder (frozen five words, mirrors
    # templates/portals-china.example.yml / portals.yml: 采购主管/采购经理/
    # 采购总监/负责人/高级采购专员)
    - "Procurement Director"
    - "Procurement Manager"
    - "Procurement Supervisor"
    - "Head"
    - "Senior Procurement Specialist"

# -- Search queries --
# Each query triggers a WebSearch. Use site: to filter by portal.
# The scanner extracts title, URL, and company from results.

search_queries:
  # -- Ashby --
  - name: Ashby — Procurement & Sourcing
    query: 'site:jobs.ashbyhq.com "Procurement Manager" OR "Sourcing Specialist" OR "Buyer" OR "Strategic Sourcing" remote'
    enabled: true

  - name: Ashby — Category & Supplier Development
    query: 'site:jobs.ashbyhq.com "Category Manager" OR "Category Buyer" OR "Supplier Development" remote'
    enabled: true

  # -- Greenhouse --
  - name: Greenhouse — Procurement
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Procurement" OR "Sourcing" OR "Buyer" remote'
    enabled: true

  # -- Lever --
  - name: Lever — Procurement & Sourcing
    query: 'site:jobs.lever.co "Procurement" OR "Sourcing" OR "Buyer" OR "Supplier Development" remote'
    enabled: true

  # -- Wellfound (startups) --
  - name: Wellfound — Procurement
    query: 'site:wellfound.com "Procurement" OR "Sourcing Specialist" OR "Buyer" remote'
    enabled: true

  # -- Workable --
  - name: Workable — Procurement Roles
    query: 'site:apply.workable.com "Procurement" OR "Sourcing" OR "Buyer" remote'
    enabled: true

# -- Tracked companies --
# Companies whose career pages are checked directly.
# scan_method: playwright (default), websearch, greenhouse_api
# For Greenhouse companies, add api: field for faster structured JSON access.
#
# 使用指引 / Usage notes:
#   - This is an EXAMPLE file: tracked_companies only ships anonymous placeholders.
#     Do NOT treat them as a recommended employer list.
#   - Replace them with YOUR real target employers (manufacturers, brand owners,
#     retailers, supply-chain service providers) by filling name + careers_url
#     and setting enabled: true.
#   - Public ATS (Workday / Greenhouse / SmartRecruiters) can be scanned directly
#     with Playwright; Mokahr / Feishu forms usually require login.

tracked_companies:

  # =====================================================
  # Anonymous placeholders — replace with your real targets
  # =====================================================

  - name: Example Industrial Manufacturer (placeholder)
    careers_url: https://careers.example-manufacturer.com/jobs
    scan_method: playwright
    notes: "示例 / placeholder: a global industrial manufacturer with a public careers page. Replace with your real target."
    enabled: false

  - name: Example Consumer Brand Group (placeholder)
    careers_url: https://jobs.example-consumerbrand.com/positions
    scan_method: playwright
    notes: "示例 / placeholder: a consumer brand group hiring category buyers and sourcing specialists. Replace with your real target."
    enabled: false

  - name: Example Greenhouse Employer (placeholder)
    careers_url: https://job-boards.greenhouse.io/exampleemployer
    api: https://boards-api.greenhouse.io/v1/boards/exampleemployer/jobs
    notes: "示例 / placeholder: a company hiring through Greenhouse (public ATS, API supported). Replace with your real target."
    enabled: false
